<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 64 64"
    role="img"
    aria-labelledby="title"
>
    <title id="title">StressIntel PRO</title>

    <defs>
        <linearGradient
            id="gradient"
            x1="0"
            y1="0"
            x2="1"
            y2="1"
        >
            <stop
                offset="0%"
                stop-color="#8B5CF6"
            />
            <stop
                offset="100%"
                stop-color="#EC4899"
            />
        </linearGradient>
    </defs>

    <!-- Background -->
    <rect
        width="64"
        height="64"
        rx="16"
        fill="#050505"
    />

    <!-- Analytical frame -->
    <rect
        x="7"
        y="7"
        width="50"
        height="50"
        rx="13"
        fill="none"
        stroke="url(#gradient)"
        stroke-width="2.5"
        opacity="0.45"
    />

    <!-- Stress signal -->
    <path
        d="M14 37
           C19 37 20 26 26 26
           C32 26 33 44 39 44
           C45 44 46 19 51 19"
        fill="none"
        stroke="url(#gradient)"
        stroke-width="3.5"
        stroke-linecap="round"
        stroke-linejoin="round"
    />

    <!-- Signal nodes -->
    <circle
        cx="14"
        cy="37"
        r="3.5"
        fill="#8B5CF6"
    />

    <circle
        cx="26"
        cy="26"
        r="3.5"
        fill="#A855F7"
    />

    <circle
        cx="39"
        cy="44"
        r="3.5"
        fill="#D946EF"
    />

    <circle
        cx="51"
        cy="19"
        r="3.5"
        fill="#EC4899"
    />

    <!-- Intelligence core -->
    <circle
        cx="32"
        cy="32"
        r="7"
        fill="#050505"
        stroke="url(#gradient)"
        stroke-width="2"
    />

    <circle
        cx="32"
        cy="32"
        r="2.2"
        fill="#FFFFFF"
    />
</svg>